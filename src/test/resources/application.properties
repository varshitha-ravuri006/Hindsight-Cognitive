# Tests use a throwaway in-memory database so they never touch ./data (the local demo database),
# and never read the developer's .env: external APIs are stubbed per test.
spring.datasource.url=jdbc:h2:mem:vishwas-test;DB_CLOSE_DELAY=-1
spring.config.import=optional:file:./does-not-exist.env[.properties]
vishwas.hindsight.api-key=
vishwas.groq.api-key=
vishwas.memory.processing-poll-ms=20
vishwas.demo.snapshot-file=./target/test-snapshot.json

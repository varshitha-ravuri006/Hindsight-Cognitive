spring:
  application:
    name: vishwas
  # Local dev: keys live in a git-ignored .env file instead of being exported by hand.
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    # File-backed so reconciliations survive restarts and stay in step with what Hindsight remembers.
    # One file per memory bank (data/vishwas-dev, data/vishwas-demo): the database always matches its bank.
    # Production: set DATABASE_URL (postgres://user:pass@host:5432/db) - see DatabaseUrlConfig.
    url: jdbc:h2:file:./data/${HINDSIGHT_BANK_ID:vishwas-dev};AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${PORT:8080}
  compression:
    enabled: true
  error:
    include-message: always

vishwas:
  # Every date shown to the user is in this zone.
  zone: Asia/Kolkata
  company:
    legal-name: Deccan Home Appliances Pvt Ltd
    gstin: 36AAGCD4821M1ZG
    state-code: "36"
    city: Hyderabad
    accountant: Lakshmi Prasad
    cfo: Srinivas Reddy
  matching:
    # Two amounts are "equal" when they differ by at most this many rupees.
    amount-tolerance-inr: 1.00
    # Fuzzy candidates: invoice dates within this many days...
    candidate-date-window-days: 10
    # ...and normalised invoice numbers within this many single-character edits.
    candidate-max-edit-distance: 2
  outcomes:
    # An open mismatch still unresolved this many months after its period is judged UNRESOLVED_AT_RISK.
    at-risk-after-months: ${AT_RISK_AFTER_MONTHS:2}
  advice:
    # Exposure at or above this is material: memory alone can never downgrade it below REQUIRE_REVIEW.
    materiality-inr: 50000
    # Fewer judged cases than this in a vendor+dimension = "thin history".
    thin-history-cases: 3
    reflect-budget: ${REFLECT_BUDGET:low}
    reflect-max-tokens: 3000
    # Vendors reflected on concurrently.
    parallelism: 12
  auto-resolve:
    # Deterministic rules the finance team has explicitly approved for AUTO_RESOLVE.
    approved-rules: FORMAT_ONLY
  memory:
    processing-poll-ms: 3000
    # When set (e.g. https://vishwas.example.com) a consolidation webhook is registered; otherwise we poll.
    public-base-url: ${VISHWAS_PUBLIC_BASE_URL:}
    webhook-secret: ${VISHWAS_WEBHOOK_SECRET:}
  hindsight:
    base-url: ${HINDSIGHT_BASE_URL:https://api.hindsight.vectorize.io}
    api-key: ${HINDSIGHT_API_KEY:}
    bank-id: ${HINDSIGHT_BANK_ID:vishwas-dev}
  groq:
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
  demo:
    # Allows the one-click "Reset demo" (clears the database and the configured memory bank).
    reset-enabled: ${VISHWAS_RESET_ENABLED:true}
    snapshot-file: ./data/snapshot.json

logging:
  level:
    com.vishwas: INFO
    org.hibernate.orm.deprecation: WARN
